name: determinism
on: [push, pull_request]
jobs:
  banned-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sim purity check (no float/double/System.Random/Godot in /sim library)
        run: |
          if grep -rnE '\b(float|double|System\.Random|Godot)\b' sim/Ferrostorm.Sim/ ; then
            echo "::error::Banned token in deterministic sim library (CLAUDE.md rules)"; exit 1
          fi
      - name: Portability check (no engine references anywhere outside /game - ADR-004)
        run: |
          if grep -rln 'using Godot' sim/ tools/ data/ ; then
            echo "::error::Engine reference outside /game - the portable surface must stay engine-free (ADR-004)"; exit 1
          fi
      - name: Seat check (the battle scene must not hardcode player 0 - C7b)
        run: |
          # C7b plumbed LocalPlayerId through the battle scene so a LAN JOINER,
          # who is player 1, sees their own selection, fog, power and treasury.
          # A reintroduced literal is INVISIBLE in single player, where the seat
          # really is 0, and breaks only for the joiner. That is the worst shape
          # a bug can have: it cannot be found by playing the game the usual
          # way. So it is guarded here rather than left to review.
          #
          # WIDENED after two sites SURVIVED the C7b-ii sweep and this grep: the
          # actor loop said 'PlayerId != 1' and both it and the minimap feed said
          # 'IsVisible(0, ...)'. Neither matches the patterns above, and both are
          # correct at seat 0 by luck. For a joiner they inverted the fog: their
          # own army drawn only where the HOST had vision, the host's army drawn
          # through the shroud. The lesson is that "player 0" is not the only way
          # to name the wrong seat - "player 1" names it just as wrongly - so the
          # literal seat is banned in BOTH directions.
          # Comment lines are filtered out, and deliberately: the fix's own
          # doc comment QUOTES the two bad expressions so the next reader knows
          # what the shape looks like, and a guard that forbids naming the bug
          # is a guard that gets the explanation deleted instead of the defect.
          # WIDENED AGAIN after an audit found three more, all correct at seat 0
          # by luck: ValidPlacement(0, ...) asked whose base anchors the build
          # radius while the command was issued as LocalPlayerId (a joiner could
          # not build ANYWHERE), and the minimap coloured by "me versus them"
          # while the battlefield coloured by player id.
          # WIDENED A THIRD TIME after the end-of-match banner was found asking
          # "_winner == 0" - did PLAYER 0 win, not did I win. At seat 1 that is
          # exactly inverted: the joiner who had just won was shown DEFEAT and
          # the host who lost was congratulated. The last thing a match says.
          HITS=$(grep -nE 'PlayerId (==|!=) [01]\b|_world\.Credits\(0\)|UpdateFrom\(_world, [01]\)|IsVisible\([01],|IsExplored\([01],|ValidPlacement\([01],|_winner (==|!=) [01]\b' game/scripts/SkirmishLive.cs | grep -vE '^[0-9]+:[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Hardcoded seat in the battle scene - use LocalPlayerId / EnemyPlayerId (C7b)"; exit 1
          fi
          # Team colour is a property of WHICH PLAYER an entity belongs to, not
          # of who is looking, or the minimap and the battlefield disagree for
          # the joiner. BattlefieldView.MarkFor is the only place allowed to
          # decide it; a seat-relative ternary over the marks is the exact shape
          # that was there.
          HITS=$(grep -rnE '(LocalPlayerId|EnemyPlayerId).*\?.*(DirectorateMark|SodalityMark)' game/scripts/ | grep -vE ':[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Team colour keyed on the viewer's seat - use BattlefieldView.MarkFor(player)"; exit 1
          fi
          if grep -nE 'FactionOf\(0\)' game/scripts/Sidebar.cs ; then
            echo "::error::Hardcoded player-0 faction gate in the sidebar - use _game.LocalPlayerId (C7b)"; exit 1
          fi
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      - name: Build
        run: dotnet build sim/Ferrostorm.Sim.Runner -c Release
      - name: Selftest
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- selftest
      - name: In-process double-run (all scenarios)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- determinism 2026
      - name: Cross-platform golden hash check
        shell: bash
        run: |
          dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- golden 2026 > got.txt
          grep -v '^#' sim/golden-hashes.txt > want.txt
          diff got.txt want.txt || { echo "::error::State hashes diverged from golden on ${{ matrix.os }}"; exit 1; }
      - name: Scenario assertions + perf report
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- match 2026
      - name: LAN lockstep (5 games in CI; nightly soak runs 20)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- lan 5
      - name: Lockstep under adverse network (chaos proxy, 60ms±30ms + stalls)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- lanchaos 1 60 30
      - name: Presentation contract (snapshot interpolation)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- spectate
      - name: Replay round-trip (record AI match, replay bit-exact)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- replay
      - name: Save/load round-trip (mid-match save resumes bit-exact)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- saveload
      - name: Campaign save round-trip (world + mission state resumes bit-exact)
        run: dotnet run --project sim/Ferrostorm.Sim.Runner -c Release --no-build -- campaignsave
      - name: Balance gate (engagement matrix + counter audit, doc 12)
        run: |
          dotnet build tools/Ferrostorm.Balance -c Release
          dotnet run --project tools/Ferrostorm.Balance -c Release --no-build

  # The headless CLIENT harness. It boots the REAL battle scene, drives it from
  # the joiner's seat and asserts on what it does; it has caught nine defects
  # that every other gate here was blind to, because the sim battery cannot see
  # the client and "it compiles" is not a test.
  #
  # It ran locally only until this job existed, which meant it protected the
  # repo exactly as often as someone remembered to run it.
  client-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      # ~105 MB, so it is cached on the version string and downloaded once per
      # Godot bump rather than once per push.
      - name: Cache the Godot mono editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7-stable-mono-linux-x86_64
      - name: Install the Godot mono editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_linux_x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
      # NO NuGet WIRING HERE, deliberately. The repo already made this decision
      # and wrote it down: the root NuGet.config clears every source for the
      # offline-first sim, and game/NuGet.config shadows it with nuget.org for
      # the one project that needs Godot.NET.Sdk. Resolution stops at the
      # nearest config walking up from the build directory, so building /game
      # picks up that override on its own.
      #
      # A first version of this job added the editor's own bundled nupkgs as a
      # source instead, to keep the build entirely offline. It works (proven in
      # a clean clone) and is the fallback if nuget.org ever becomes a problem
      # here - but it invented a second policy beside one the repo had already
      # settled, so it is not what ships.
      - name: Drive the real battle scene headless (67 checks)
        run: |
          GODOT="$(find ~/godot -type f -name 'Godot_v4.7-stable_mono_linux.x86_64' | head -1)"
          test -n "$GODOT" || { echo "::error::no Godot binary in the install"; exit 1; }
          chmod +x "$GODOT"
          GODOT="$GODOT" ./tools/verify-client.sh
