# P7-2b. The Directorate's defence, and it is written doctrine rather than
# invention: GDD s3 gives the Directorate "strongest armour" and "buildings are
# tough but expensive". The Bastion is exactly that - it costs more than two
# turrets, it outlasts anything else on the field, and it is the wrong answer to
# a rush because it is slow to raise. Weakness "slow, expensive, telegraphed"
# applies to its defence as much as to its army.
# EntityKind.Bastion has been reserved in the enum since before this wave.
id: dir_bastion
name: Bastion
faction: directorate
cost: 1400
build_time_ticks: 300
hp: 1600
power_supply: 0
power_draw: 40
sight_range: 7
footprint: 2
weapon_ids: [wpn_turret_gun]
prerequisites: [com_radar_uplink]
build_tab: defence
# P7-22 (ADR-063): the Directorate's ORBITAL SCAN, GDD s3 line 25, doctrine word
# "surgical". The Bastion carries it because it is the Directorate's EYE as much
# as its gun - sight_range 7 is the widest of any building in the game - and
# because GDD s8's counterplay rule ("scout the structure, kill it") wants the
# unlocking building to be findable and killable, which a forward defensive
# hardpoint is by construction.
#
# The scan's RADIUS is this building's own sight_range, not a separate number:
# the scan shows what its sensors would see, projected anywhere on the map.
# Change sight_range and the scan changes with it, deliberately.
#
# P7-23 added the PRECISION STRIKE beside it, and made this a LIST because it
# had to be: GDD s8 asks for 3-4 powers per faction and the Directorate owns
# three exclusive buildings, one of which cannot carry a power and one of which
# is the first thing anyone builds. The two SHARE this building's charge, so a
# Bastion holds a scan OR a strike ready and never both - the choice is the
# player's, which is what "surgical" should feel like.
support_powers: [orbital_scan, precision_strike]
