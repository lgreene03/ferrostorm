# DR-14 / doc 28. GDD line 76's first rung: "no cheats, slow".
# A rung row owns how GOOD a commander is and never what shape it takes: the
# beat ratio, the mining, and (at the top rung only) a declared handicap. It is
# refused if it tries to author a wave size, because that is the personality's
# and conflating the two is the defect the ladder was written to undo.
# THE BEAT IS A RATIO, not a multiplier, and that is not decoration: the ladder
# needs Brutal's two thirds exactly, and CLAUDE.md forbids any floating-point
# type anywhere in /sim. A numerator and a denominator keep the arithmetic
# integer and the truncation visible - the commander computes
# act_every_ticks * beat_numerator / beat_denominator and floors the result at 1.
# beat_numerator 2 over beat_denominator 1 makes Easy think at HALF SPEED: 30
# ticks between decisions against Standard's 15. That is the honest way to be a
# worse opponent. It reacts late to a harassed harvester, it re-queues its base
# ladder slowly, and its waves assemble at half the rate; a player wins by
# moving faster than it does, which is a skill the game is actually about.
# harvesters_per_refinery 1 and starting_credit_handicap 0: Easy is granted
# NOTHING. GDD line 76 promises "no cheats" on this rung and the promise is kept
# by giving it the same economy the shipped commander always had and then
# slowing its hands. A rung that mined less would be tempting and wrong: it
# would make the early game a walkover rather than a slower fight.
id: ai_easy
name: Easy
kind: rung
beat_numerator: 2
beat_denominator: 1
harvesters_per_refinery: 1
starting_credit_handicap: 0
# P8-22 (ADR-079, decision D7): what this rung SPENDS. A commander used to bank
# for the whole match (spendprobe at the base: a Normal Directorate seat held a
# mean of 29725 credits and sat at or above 4500 for 93 per cent of its
# seconds) because one barracks and one factory cannot spend its income.
# producer_cap 1 is D7's Easy cap: the ladder's own one barracks and one
# factory, and no more, however much it banks. It still places several orders
# a beat when it can afford them, and still buys its personality's further
# faction defences from a sustained surplus.
# surplus_reserve 4500 is the superweapon rung's own credit test, the dearest
# in the ladder, so nothing it buys out of surplus can starve a rung.
# surplus_window_ticks 4500 is five minutes, MEASURED rather than chosen. At
# the base, of the 423 stretches a Normal or Hard treasury spent at or above
# 4500 and then lost before its match ended (spendprobe), 357 lasted under
# two minutes, one between two and three, none between three and five, and
# 65 five minutes or more: a bank that has stood for five minutes is income,
# not a single delivery. Two minutes, the near edge of that gap, was built
# and measured too and failed two of P8-22's bars: the commander ended matches
# so early that only 20 of pillargate's 72 launched a superweapon (F8 asks
# for half), and seatfairgate's split by start went to 21/7 (the bar is
# 60/40). The same at every rung today; P8-26 judges whether one should differ.
producer_cap: 1
surplus_reserve: 4500
surplus_window_ticks: 4500
