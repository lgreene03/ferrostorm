# TICKET-AI-03. The commander that waits and then arrives all at once.
# Same beat as Standard, for the same reason Rusher keeps it: patience is a
# shape, not a strength, and the rung files own strength (DR-14).
# wave_size 10 buys a bigger hammer with time. Ten units take far longer to
# stand ready, so the early game is quiet and the player is free to expand; when
# the wave does come it is large enough to break a base rather than trade with
# it. The garrison rule turns the same number into a real defence too, since
# half of ten is five fighters held at home, which is what makes this commander
# hard to harass and slow to threaten.
id: ai_turtle
name: Turtle
kind: personality
act_every_ticks: 15
wave_size: 10
# P8-17 (ADR-072): the air answer, on Standard's rule. The cap is this
# personality's wave size, ten, though the commander only builds one more than
# the most flyers it has seen at once; the garrison keeps the floor of two.
anti_air_cap: 10
anti_air_garrison: 2
# P8-22 (ADR-079): faction_defence_cap 5, on Standard's rule: this
# personality's ground garrison, half of ten. P8-23 owns the Turtle's walls and
# any further defences beyond this.
faction_defence_cap: 5
