# TICKET-AI-03. The commander that goes early and goes often.
# Same beat as Standard: a Rusher is not a better commander, only an impatient
# one, and giving it a faster beat here would be the personality-and-difficulty
# conflation DR-14 exists to undo. Strength belongs to the rung files.
# wave_size 4 is the whole personality. A smaller wave stands ready sooner, so
# the first attack lands while the defender is still building, and the 300-tick
# spacing between waves then makes the pressure continuous rather than a single
# push. The cost is paid honestly: four units lose the stand-up fight that six
# would win, so this is a shape a player can beat by holding rather than a
# strength they have to out-produce.
# The garrison is half the wave size with a floor of two, so this commander
# still keeps two fighters at home; it attacks with less, not with everything.
id: ai_rusher
name: Rusher
kind: personality
act_every_ticks: 15
wave_size: 4
# P8-17 (ADR-072): the air answer, on Standard's rule. The cap is this
# personality's wave size, so a Rusher holds at most four anti-air units, and the
# garrison keeps the same floor of two at home.
anti_air_cap: 4
anti_air_garrison: 2
# P8-22 (ADR-079): faction_defence_cap 2, on Standard's rule: this
# personality's ground garrison, half of four with the floor of two.
faction_defence_cap: 2
# P8-23 (ADR-080): how this commander's waves go, on Standard's rules: growth
# 2 is its ground garrison (half of four with the floor of two), cap 8 twice
# its wave, staging 10 cells out (ADR-053's arrival bound), all-in at twice the
# enemy's army.
# rush_tick 1350 is the whole addition: 90 seconds into the match, the row's
# own number, this commander pushes with its infantry, once. The push is not a
# new size: it leaves once a wave's worth of armed infantry (wave_size, 4)
# stands and takes at most a wave and its garrison (6), which is the row's
# "4 to 6 infantry" read off this file's own two numbers. Any wave launched
# before the push stands makes it moot, and it is never made after one.
wave_growth: 2
wave_cap: 8
staging_cells: 10
all_in_percent: 200
rush_tick: 1350
walls_per_defence: 0
