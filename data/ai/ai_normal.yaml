# DR-14 / doc 28. GDD line 76's second rung: "competent build orders".
# THE IDENTITY RUNG, and the reason a whole difficulty ladder was added without
# moving a single golden hash. Every number here is the value the commander used
# before the ladder existed: the beat ratio is 1/1, so the personality's own
# act_every_ticks passes through untouched, and the mining and the handicap are
# the shipped ones. difficultygate pins this as a measured claim by playing a
# full match at Normal and at the pre-ladder default and comparing state hashes,
# so a future edit that quietly changes this file fails there and not six months
# later in a hash nobody can explain.
# Edit these four numbers and you are not tuning Normal, you are moving the
# baseline every other rung is defined against and every golden was recorded
# against. That is an ADR and an Architect sign-off (CLAUDE.md), not a balance
# tweak.
id: ai_normal
name: Normal
kind: rung
beat_numerator: 1
beat_denominator: 1
harvesters_per_refinery: 1
starting_credit_handicap: 0
# P8-22 (ADR-079, decisions D6 and D7): what this rung SPENDS, and the three
# numbers D6 means when it says the commander improves at every rung while
# Normal stays the identity of the knob table. difficultygate's identity claim
# is that the default commander IS this row, which holds whatever they read.
# producer_cap 2 is D7's Normal cap: a second barracks and a second factory,
# each bought only once its own kind is the bottleneck and the surplus is
# sustained. surplus_reserve 4500 and surplus_window_ticks 1800 are Easy's,
# with the same derivation (the superweapon rung's threshold; the measured
# two-minute edge between a passing bank and a sustained one).
producer_cap: 2
surplus_reserve: 4500
surplus_window_ticks: 1800
